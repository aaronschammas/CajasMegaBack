services:
  mysql:
    image: mysql:8.0
    container_name: megacajas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-fuerte_caja}
      MYSQL_USER: ${DB_USER:-megacajas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-megacajas_change_me}
    # Puerto SOLO accesible desde el propio VPS (127.0.0.1), nunca expuesto a internet.
    # Si necesitás administrar la BD remotamente, usá un tunel SSH:
    #   ssh -L 3306:127.0.0.1:3306 usuario@tu-vps
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: megacajas-mongo
    restart: unless-stopped
    # Puerto SOLO accesible desde el propio VPS (127.0.0.1), nunca expuesto a internet.
    # Tunel SSH para administrar remotamente:
    #   ssh -L 27017:127.0.0.1:27017 usuario@tu-vps
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
    container_name: megacajas-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8080
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-megacajas}
      DB_PASSWORD: ${DB_PASSWORD:-megacajas_change_me}
      DB_NAME: ${DB_NAME:-fuerte_caja}
      DB_CHARSET: utf8mb4
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-megacajas_alquileres}
      JWT_SECRET: ${JWT_SECRET:-change_me_please_use_at_least_64_chars_for_production_1234567890}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@admin.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123456}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_CSRF: ${ENABLE_CSRF:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./Nuevo_Front
      args:
        BACKEND_URL: http://backend:8080
    container_name: megacajas-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  mongo_data:
